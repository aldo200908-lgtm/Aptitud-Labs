name: Aptitud Labs | Motion V5 preview on GitHub Pages

on:
  push:
    branches:
      - preview/github-pages-motion-v5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aptitud-github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/preview/github-pages-motion-v5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only the Motion V5 preview
        uses: actions/checkout@v4
      - name: Build scoped Pages assets (no production changes)
        run: python3 scripts/build-gh-pages-preview.py --repo Aptitud-Labs --output _site
      - name: Validate rebased assets and page routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site=Path('_site')
          for relative in ('index.html','proyectos/index.html','servicios/index.html',
                           'planes/index.html','nfc-qr/index.html','cotizar/index.html',
                           'assets/motion-graphics-v5.css','assets/motion-graphics-v5.js'):
              assert (site/relative).is_file(), relative
          # Confirm all homepage portals now show real project/catalogue media.
          import re
          home=(site/'index.html').read_text(encoding='utf-8')
          for selector in ('v3-gateway-services v6-realwork-card','v3-gateway-plans v6-realwork-card','v3-gateway-nfc v6-realwork-card'):
              assert selector in home, f'Missing improved image card: {selector}'
          for asset in ('assets/projects/sushi-ten-bento-cover.png',
                        'assets/projects/pulso-cover.webp',
                        'assets/projects/tienda-cover.webp',
                        'assets/nfc/stand-01.webp',
                        'assets/nfc/smartphone.webp',
                        'assets/gateway-realwork-v6.css',
                        'assets/gateway-realwork-v6.js'):
              assert (site/asset).is_file(), f'Image or style missing from publication: {asset}'
              assert '/Aptitud-Labs/'+asset in home, f'Rebased reference missing: {asset}'
          for obsolete in ('class="v3-gateway-graphic"','class="v3-plan-graphic"',
                           'class="v3-nfc-graphic"'):
              assert obsolete not in home, f'Generic illustration remains: {obsolete}'
          assert len(re.findall(r'class="home-gateway-item',home))==4, 'Home should have 4 navigable cards'
          print('All four portals and the five authentic visual assets checked.')
          print('GitHub Pages preview contents verified.')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 7

      - name: Publish static preview branch (no Pages API required)
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "preview: Motion Graphics V5 static site"
          git branch -M gh-pages
          git remote add target "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force target gh-pages
