name: Calidad del sitio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verificar enlaces, SEO, rutas y JavaScript
        run: |
          node scripts/check-site.mjs
          node scripts/test-site-theme.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador de pruebas
        run: python -m pip install --disable-pip-version-check "selenium>=4.20,<5"
      - name: Comprobar menú, formulario y exportación en Chromium
        run: python scripts/browser_smoke.py
      - name: Medir rendimiento móvil sintético de la página de Puno (informativo)
        run: python scripts/performance_probe.py
  public-site-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Diagnosticar DNS y acceso público (informativo)
        run: node scripts/check-live.mjs
