name: Studio Next | Build and isolated Pages preview

on:
  push:
    branches: ["redesign/aptitud-clean-studio"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aptitud-studio-next-preview
  cancel-in-progress: true

jobs:
  build-test-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign sources (main and current Pages root stay untouched)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate fresh, multi-page Studio Next experience
        run: python3 scripts/build-studio-next.py

      - name: Prepare combined site with existing binary imagery
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add --detach /tmp/aptitud-gh-pages origin/gh-pages
          mkdir -p /tmp/aptitud-gh-pages/rebuild
          rsync -a --delete rebuild-output/ /tmp/aptitud-gh-pages/rebuild/
          test -f /tmp/aptitud-gh-pages/rebuild/index.html
          test -f /tmp/aptitud-gh-pages/rebuild/proyectos/index.html
          test -f /tmp/aptitud-gh-pages/rebuild/nfc-qr/index.html
          echo "Isolated preview assembled."

      - name: Browser QA prerequisites
        run: python3 -m pip install --disable-pip-version-check "selenium>=4.20,<5"

      - name: Inspect all routes and functional flows with Chromium
        run: python3 scripts/test-studio-next.py --root /tmp/aptitud-gh-pages

      - name: Upload mobile/desktop screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-next-visual-qa
          path: rebuild-evidence/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish only /rebuild/, without replacing live preview root or production
        run: |
          set -euo pipefail
          cd /tmp/aptitud-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild
          if git diff --cached --quiet; then
            echo "No changes in rebuild preview"
          else
            git commit -m "preview: isolated Studio Next multipage design"
            git push origin HEAD:gh-pages
          fi
          echo "Preview: https://aldo200908-lgtm.github.io/Aptitud-Labs/rebuild/"
